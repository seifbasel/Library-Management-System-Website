{% extends 'students/layouts/base.html' %}
{% block title %}Password changed · LMS Library{% endblock %}
{% block page_width %}--narrow{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: var(--space-16) auto; text-align: center">
  <div class="card-body">
    <span class="empty-state__icon" aria-hidden="true" style="margin-bottom: var(--space-4); background-color: var(--color-success-soft); color: var(--color-success)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </span>
    <h1>Password changed</h1>
    <p>Your password was updated successfully.</p>
    <a href="{% url 'students:profile' %}" class="btn btn-primary">Back to profile</a>
  </div>
</div>
{% endblock %}
