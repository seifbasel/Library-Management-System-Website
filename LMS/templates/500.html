<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f6f7fb;
      color: #1b2136;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border: 1px solid #e3e6ef;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(23, 27, 46, 0.08);
      max-width: 440px;
    }
    h1 { font-size: 2.25rem; margin: 0 0 12px; }
    p { color: #4b5468; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #3c4b9e 0%, #6c57b0 55%, #12817a 100%);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0b0e17; color: #edeff7; }
      .card { background: #12162a; border-color: #262c42; box-shadow: 0 16px 40px rgba(0,0,0,.55); }
      p { color: #aab2c8; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>500</h1>
    <p>Something went wrong on our end. Please try again in a moment.</p>
    <a href="/">Go back home</a>
  </div>
</body>
</html>
